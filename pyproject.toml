[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-backend-sdk"
version = "0.5.1"
description = "Unofficial Python SDK for the ChatGPT Codex backend API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["openai", "codex", "chatgpt", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
openai    = [
    "openai>=2.53.0; python_version >= '3.10'",
    "openai>=1.0,<2.53.0; python_version < '3.10'",
]
dev       = [
    "pytest>=7.0",
    "openai>=2.53.0; python_version >= '3.10'",
    "openai>=1.0,<2.53.0; python_version < '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_backend_sdk"]
